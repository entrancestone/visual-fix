name: Require pr-guardian
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    # pr-guardian #773 originally dropped synchronize because the pipeline
    # pushed the head before writing the body attestation, so a synchronize
    # event pinned a FAILURE check to the new head before the body was rewritten.
    # Since pr-guardian the pipeline writes the attestation BEFORE it
    # pushes, so synchronize is now exactly the event that judges a
    # pipeline-pushed head - hence it is restored under T2.
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
    # Never create a run for a release-please PR. The job-level author exemption
    # below cannot do this: it is evaluated inside a run, and a GITHUB_TOKEN PR's
    # run is created in action_required and never starts.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json
      - plugin.json

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep reopened coalescing as before.
concurrency:
  group: pr-guardian-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via pr-guardian
    runs-on: ubuntu-latest
    # Known automation accounts are exempt so automation keeps working:
    # - github-actions[bot] opens PRs via GITHUB_TOKEN
    # - dependabot[bot] and release-please[bot] open automated PRs
    # Other authors (human or bot) must raise PRs through `git push pr-guardian`.
    #
    # These stay job-level rather than moving to the action's `exempt-authors`
    # input on purpose: an in-job exemption still requires the run to start, and
    # a GITHUB_TOKEN PR's run is created in action_required and never starts.
    # Keeping the condition here preserves the exact verdict shape this
    # repository's gate already produces for those authors.
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      # The enforcement itself now lives in the shared composite action in the
      # pr-guardian repository, so this repository no longer carries its own
      # copy of the script to drift.
      #
      # Pinned to an immutable commit, never @main: main is editable by the very
      # pull request this gate is judging. Bumping the pin is a separate,
      # deliberate pull request.
      - name: Verify pr-guardian signature and pipeline attestation in PR body
        uses: entrancestone/pr-guardian/.github/actions/require-pr-guardian@5782e2b055b268132494c91bae1594939783b305 # main
        with:
          exempt-authors: entrancestone
